<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriados de Chile - Año Actual</title>
    
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="script.js"></script>
</head>
<body>
    <div class="container mt-5" style="max-width: 800px; margin: 0 auto;">
        <h1 class="text-center mb-4" id="tituloAño">Feriados de Chile para el Año Actual</h1>
        
        <!-- Alerta de carga -->
        <div id="loading-alert" class="alert alert-info text-center">Cargando feriados desde la API... Por favor espera.</div>
        
        <!-- Contenedor de tabla (oculto inicialmente) -->
        <div id="holidays-container" style="display: none;">
            <table class="table table-striped table-hover" id="feriadosTable">
                <thead class="table-dark">
                    <tr>
                        <th>Fecha</th>
                        <th>Nombre del Feriado</th>
                        <th>Tipo</th>
                        <th>Irrenunciable</th>
                    </tr>
                </thead>
                <tbody id="holidays-body">
                    <!-- Filas dinámicas aquí -->
                </tbody>
            </table>
        </div>
        
        <!-- Alerta para no datos o error de la API -->
        <div id="no-holidays-alert" class="alert alert-warning" style="display: none;"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
